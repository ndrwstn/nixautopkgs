name: Update SolidCraft hashes on Renovate PRs

on:
  # Updaters stay on pull_request_target: a push made with GITHUB_TOKEN cannot
  # start workflows, but a pull_request trigger would instead park a run in the
  # approval-required state, which never executes and keeps the PR pending.
  pull_request_target:
    branches: [master]
    paths:
      - "packages/solidcraft/**"
      - ".github/scripts/report-status.sh"
      - ".github/workflows/solidcraft-hash-update.yml"

concurrency:
  group: solidcraft-hash-update-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  update-solidcraft:
    if: startsWith(github.head_ref, 'update/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      statuses: write
      actions: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@2559b44fed7d4fc978e8dd0e379661afb8b73590 # main

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@f69a2d3e148e90223fe63ab6e3f6331f2e7e33dc # main

      - name: Assert Renovate branch context
        run: |
          [[ "${GITHUB_HEAD_REF}" == update/* ]]
          [[ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]

      - name: Update lock file, hashes, and build
        run: |
          version="$(sed -n 's/^  version = "\([^"]*\)";$/\1/p' packages/solidcraft/default.nix)"
          if [[ -z "$version" ]]; then
            echo "could not read the SolidCraft version" >&2
            exit 1
          fi
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/tangency-labs/solidcraft/v$version/Cargo.lock" \
            > packages/solidcraft/locks/solidcraft.Cargo.lock
          nix run nixpkgs#nix-update -- --flake --version=skip solidcraft
          out="$(nix build --no-link --print-out-paths .#solidcraft)"
          test -x "$out/bin/solidcraft"
          test -x "$out/bin/solidcraft-cli"

      - name: Commit and push hash updates
        run: |
          if [[ -z "$(git status --porcelain -- packages/solidcraft)" ]]; then
            echo "No hash changes detected"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/solidcraft
          git commit -m "chore: update SolidCraft package hashes"
          git push

      - name: Dispatch SolidCraft checks for the updated branch
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run solidcraft-checks.yml --ref "$GITHUB_HEAD_REF" || echo "check dispatch skipped"

      - name: Report success on the pushed commit
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/report-status.sh success "hash-update/solidcraft" "built solidcraft and solidcraft-cli on x86_64-linux"

      - name: Report failure on the evaluated commit
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/report-status.sh failure "hash-update/solidcraft" "hash refresh or build failed" || true
