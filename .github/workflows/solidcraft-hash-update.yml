name: Update SolidCraft hashes on Renovate PRs

on:
  pull_request_target:
    branches: [master]
    paths:
      - "packages/solidcraft/default.nix"
      - "packages/solidcraft/locks/*.lock"
      - ".github/workflows/solidcraft-hash-update.yml"

concurrency:
  group: solidcraft-hash-update-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  update-solidcraft:
    if: startsWith(github.head_ref, 'update/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@2cb76beab460be7e44442c7ebdcbc30b638416df # main

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@f69a2d3e148e90223fe63ab6e3f6331f2e7e33dc # main

      - name: Assert Renovate branch context
        run: |
          [[ "${GITHUB_HEAD_REF}" == update/* ]]
          [[ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]

      - name: Update lock file, hashes, and build
        run: |
          version="$(sed -n 's/^  version = "\([^"]*\)";$/\1/p' packages/solidcraft/default.nix)"
          if [[ -z "$version" ]]; then
            echo "could not read the SolidCraft version" >&2
            exit 1
          fi
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/tangency-labs/solidcraft/v$version/Cargo.lock" \
            > packages/solidcraft/locks/solidcraft.Cargo.lock
          nix run nixpkgs#nix-update -- --flake --version=skip solidcraft
          nix build .#solidcraft

      - name: Commit and push hash updates
        run: |
          if [[ -z "$(git status --porcelain -- packages/solidcraft)" ]]; then
            echo "No hash changes detected"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/solidcraft
          git commit -m "chore: update SolidCraft package hashes"
          git push
