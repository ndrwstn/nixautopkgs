name: Update agent-browser hashes on Renovate PRs

on:
  # Updaters stay on pull_request_target: a push made with GITHUB_TOKEN cannot
  # start workflows, but a pull_request trigger would instead park a run in the
  # approval-required state, which never executes and keeps the PR pending.
  pull_request_target:
    branches: [master]
    paths:
      - "packages/agent-browser/default.nix"
      - ".github/scripts/update-agent-browser-hashes.sh"
      - ".github/scripts/report-status.sh"
      - ".github/workflows/agent-browser-hash-update.yml"

concurrency:
  group: agent-browser-hash-update-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  update-agent-browser-hashes:
    # Only this package's Renovate branches. `update/` alone would also match
    # action-digest bumps, which touch every workflow file.
    if: startsWith(github.head_ref, 'update/vercel-labs-agent-browser') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      statuses: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@2cb76beab460be7e44442c7ebdcbc30b638416df # main

      - name: Assert Renovate branch context
        run: |
          echo "head_ref=${GITHUB_HEAD_REF}"
          echo "head_repo=${{ github.event.pull_request.head.repo.full_name }}"
          echo "base_repo=${{ github.repository }}"
          [[ "${GITHUB_HEAD_REF}" == update/* ]]
          [[ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]

      - name: Update agent-browser hashes
        run: ./.github/scripts/update-agent-browser-hashes.sh

      - name: Build agent-browser package
        run: nix build .#agent-browser

      - name: Commit and push changes
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No hash changes detected"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/agent-browser/default.nix
          git commit -m "chore: update agent-browser hashes"
          git push

      - name: Report success on the pushed commit
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/report-status.sh success "hash-update/agent-browser" "built agent-browser on x86_64-linux"

      - name: Report failure on the evaluated commit
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/report-status.sh failure "hash-update/agent-browser" "hash refresh or build failed" || true
