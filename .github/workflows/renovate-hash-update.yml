name: Update Package Hashes on Renovate PRs

on:
  # Updaters stay on pull_request_target: a push made with GITHUB_TOKEN cannot
  # start workflows, but a pull_request trigger would instead park a run in the
  # approval-required state, which never executes and keeps the PR pending.
  pull_request_target:
    branches: [master]
    paths:
      - "packages/gcs/default.nix"
      - "packages/clamav/default.nix"
      - "packages/television/default.nix"
      - ".github/scripts/report-status.sh"
      - ".github/workflows/renovate-hash-update.yml"

concurrency:
  group: renovate-hash-update-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  update-package-hashes:
    # Only the tracked packages' Renovate branches. `update/` alone would also
    # match action-digest bumps, which touch every workflow file.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'update/richardwilkes-gcs') ||
       startsWith(github.head_ref, 'update/alexpasmantier-television') ||
       startsWith(github.head_ref, 'update/clamav-'))
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      statuses: write
      actions: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@2cb76beab460be7e44442c7ebdcbc30b638416df # main

      - name: Setup Nix cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nixautopkgs
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Assert Renovate branch context
        run: |
          echo "head_ref=${GITHUB_HEAD_REF}"
          echo "head_repo=${{ github.event.pull_request.head.repo.full_name }}"
          echo "base_repo=${{ github.repository }}"
          [[ "${GITHUB_HEAD_REF}" == update/* ]]
          [[ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]

      - name: Detect package paths updated in PR
        id: detect-packages
        run: |
          git fetch origin "${{ github.base_ref }}:${{ github.base_ref }}"
          CHANGED_FILES="$(git diff --name-only "${{ github.base_ref }}...HEAD")"

          echo "Changed files:"
          printf '%s\n' "$CHANGED_FILES"

          run_gcs=false
          run_clamav=false
          run_television=false

          if printf '%s\n' "$CHANGED_FILES" | grep -qx "packages/gcs/default.nix"; then
            run_gcs=true
          fi

          if printf '%s\n' "$CHANGED_FILES" | grep -qx "packages/clamav/default.nix"; then
            run_clamav=true
          fi

          if printf '%s\n' "$CHANGED_FILES" | grep -qx "packages/television/default.nix"; then
            run_television=true
          fi

          echo "run_gcs=$run_gcs" >> "$GITHUB_OUTPUT"
          echo "run_clamav=$run_clamav" >> "$GITHUB_OUTPUT"
          echo "run_television=$run_television" >> "$GITHUB_OUTPUT"

      - name: Update gcs hashes
        if: steps.detect-packages.outputs.run_gcs == 'true'
        run: nix run nixpkgs#nix-update -- --flake --version=skip gcs

      - name: Update clamav hashes
        if: steps.detect-packages.outputs.run_clamav == 'true'
        run: nix run nixpkgs#nix-update -- --flake --version=skip clamav

      - name: Update television hashes
        if: steps.detect-packages.outputs.run_television == 'true'
        run: nix run nixpkgs#nix-update -- --flake --version=skip television

      - name: Build gcs package
        if: steps.detect-packages.outputs.run_gcs == 'true'
        run: nix build .#gcs

      - name: Build clamav package
        if: steps.detect-packages.outputs.run_clamav == 'true'
        run: nix build .#clamav

      - name: Build television package
        if: steps.detect-packages.outputs.run_television == 'true'
        run: nix build .#television

      - name: Commit and push changes
        run: |
          if [[ "${{ steps.detect-packages.outputs.run_gcs }}" != "true" && "${{ steps.detect-packages.outputs.run_clamav }}" != "true" && "${{ steps.detect-packages.outputs.run_television }}" != "true" ]]; then
            echo "No updateable package paths changed in PR"
            exit 0
          fi

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No hash changes detected"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/gcs/default.nix packages/clamav/default.nix packages/television/default.nix
          git commit -m "chore: update package hashes"
          git push

      - name: Report success on the pushed commit
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/report-status.sh success "hash-update/core" "built changed packages on x86_64-linux"

      - name: Dispatch gcs checks for the updated branch
        if: success() && steps.detect-packages.outputs.run_gcs == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run gcs-checks.yml --ref "$GITHUB_HEAD_REF" || echo "check dispatch skipped"

      - name: Report failure on the evaluated commit
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/report-status.sh failure "hash-update/core" "hash refresh or build failed" || true
