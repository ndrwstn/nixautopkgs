name: Update ConstructCraft hashes on Renovate PRs

on:
  # Updaters stay on pull_request_target: a push made with GITHUB_TOKEN cannot
  # start workflows, but a pull_request trigger would instead park a run in the
  # approval-required state, which never executes and keeps the PR pending.
  pull_request_target:
    branches: [master]
    paths:
      - "packages/constructcraft/**"
      - ".github/scripts/report-status.sh"
      - ".github/workflows/constructcraft-hash-update.yml"

concurrency:
  group: constructcraft-hash-update-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  update-constructcraft:
    if: startsWith(github.head_ref, 'update/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      statuses: write
      actions: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@2cb76beab460be7e44442c7ebdcbc30b638416df # main

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@f69a2d3e148e90223fe63ab6e3f6331f2e7e33dc # main

      - name: Assert Renovate branch context
        run: |
          [[ "${GITHUB_HEAD_REF}" == update/* ]]
          [[ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]

      - name: Update lock file, hashes, and build
        run: |
          version="$(sed -n 's/^  version = "\([^"]*\)";$/\1/p' packages/constructcraft/default.nix)"
          if [[ -z "$version" ]]; then
            echo "could not read the ConstructCraft version" >&2
            exit 1
          fi
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/francisreboucas/constructcraft/v$version/Cargo.lock" \
            > packages/constructcraft/locks/constructcraft.Cargo.lock
          nix run nixpkgs#nix-update -- --flake --version=skip constructcraft
          out="$(nix build --no-link --print-out-paths .#constructcraft)"
          test -x "$out/bin/constructcraft"
          test -x "$out/bin/ccad"

      - name: Commit and push hash updates
        run: |
          if [[ -z "$(git status --porcelain -- packages/constructcraft)" ]]; then
            echo "No hash changes detected"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/constructcraft
          git commit -m "chore: update ConstructCraft package hashes"
          git push

      - name: Dispatch ConstructCraft checks for the updated branch
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run constructcraft-checks.yml --ref "$GITHUB_HEAD_REF" || echo "check dispatch skipped"

      - name: Report success on the pushed commit
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/report-status.sh success "hash-update/constructcraft" "built constructcraft and ccad on x86_64-linux"

      - name: Report failure on the evaluated commit
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/report-status.sh failure "hash-update/constructcraft" "hash refresh or build failed" || true
