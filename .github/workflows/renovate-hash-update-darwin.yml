name: Update ocrit hashes on Renovate PRs (Darwin)

on:
  # Updaters stay on pull_request_target: a push made with GITHUB_TOKEN cannot
  # start workflows, but a pull_request trigger would instead park a run in the
  # approval-required state, which never executes and keeps the PR pending.
  pull_request_target:
    branches: [master]
    paths:
      - "packages/ocrit/default.nix"
      - ".github/scripts/report-status.sh"
      - ".github/workflows/renovate-hash-update-darwin.yml"

concurrency:
  group: renovate-hash-update-darwin-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  update-ocrit-hashes:
    # Only this package's Renovate branches. `update/` alone would also match
    # action-digest bumps, which touch every workflow file.
    if: startsWith(github.head_ref, 'update/insidegui-ocrit') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    permissions:
      contents: write
      statuses: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@2cb76beab460be7e44442c7ebdcbc30b638416df # main

      - name: Setup Nix cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nixautopkgs
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Assert Renovate branch context
        run: |
          echo "head_ref=${GITHUB_HEAD_REF}"
          echo "head_repo=${{ github.event.pull_request.head.repo.full_name }}"
          echo "base_repo=${{ github.repository }}"
          [[ "${GITHUB_HEAD_REF}" == update/* ]]
          [[ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]

      - name: Update ocrit hashes
        run: nix run nixpkgs#nix-update -- --flake --version=skip ocrit

      - name: Build ocrit package
        run: nix build .#ocrit

      - name: Commit and push changes
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No hash changes detected"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/ocrit/default.nix
          git commit -m "chore: update ocrit hashes"
          git push

      - name: Report success on the pushed commit
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/report-status.sh success "hash-update/ocrit" "built ocrit on aarch64-darwin"

      - name: Report failure on the evaluated commit
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/report-status.sh failure "hash-update/ocrit" "hash refresh or build failed" || true
