name: Update ocrit hashes on Renovate PRs (Darwin)

on:
  pull_request:
    branches: [master]
    paths:
      - "packages/ocrit/default.nix"
      - ".github/workflows/renovate-hash-update-darwin.yml"

concurrency:
  group: renovate-hash-update-darwin-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  update-ocrit-hashes:
    if: startsWith(github.head_ref, 'update/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@2cdbb78a6eed25b3bc8b97f863549be5f6567e55 # main

      - name: Assert Renovate branch context
        run: |
          echo "head_ref=${GITHUB_HEAD_REF}"
          echo "head_repo=${{ github.event.pull_request.head.repo.full_name }}"
          echo "base_repo=${{ github.repository }}"
          [[ "${GITHUB_HEAD_REF}" == update/* ]]
          [[ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]

      - name: Update ocrit hashes
        run: nix run nixpkgs#nix-update -- --flake --version=skip ocrit

      - name: Build ocrit package
        run: nix build .#ocrit

      - name: Commit and push changes
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No hash changes detected"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/ocrit/default.nix
          git commit -m "chore: update ocrit hashes"
          git push
