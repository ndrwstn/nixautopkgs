name: Check ArtCraft packages

on:
  # Hash updaters push with GITHUB_TOKEN, which cannot start workflows. A
  # pull_request trigger would instead park a run in the approval-required
  # state, where it never executes and keeps the PR pending forever. So the
  # updater dispatches this workflow once the branch is fixed, and the
  # pull_request_target trigger covers human changes and flake bumps.
  workflow_dispatch:
  pull_request_target:
    branches: [master]
    paths:
      - "packages/artcraft/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/artcraft-packages.txt"
      - ".github/workflows/artcraft-checks.yml"

concurrency:
  group: artcraft-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # update/* branches that have an ArtCraft hash updater are owned by it: it
    # dispatches this workflow once the branch is fixed. Other Renovate branches
    # (notably update/nixpkgs) have no updater, so they are validated here.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       !startsWith(github.head_ref, 'update/artcraft-suite') &&
       !startsWith(github.head_ref, 'update/storytold-'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@2559b44fed7d4fc978e8dd0e379661afb8b73590 # main

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@f69a2d3e148e90223fe63ab6e3f6331f2e7e33dc # main

      - name: Evaluate ArtCraft packages
        run: |
          nix flake check --system "${{ matrix.system }}"
          nix flake show --system "${{ matrix.system }}"

      - name: Build ArtCraft packages
        run: |
          # --keep-going so one broken application does not hide the rest.
          attrs=()
          while read -r package; do
            [[ -n "$package" ]] && attrs+=(".#$package")
          done < .github/artcraft-packages.txt
          nix build --keep-going --system "${{ matrix.system }}" "${attrs[@]}"
