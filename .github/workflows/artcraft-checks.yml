name: Check ArtCraft packages

on:
  pull_request:
    branches: [master]
    paths:
      - "packages/artcraft/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/artcraft-checks.yml"

concurrency:
  group: artcraft-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e # main

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@f69a2d3e148e90223fe63ab6e3f6331f2e7e33dc # main
        with:
          use-gha-cache: true
          use-flakehub: false

      - name: Evaluate ArtCraft packages
        run: |
          nix flake check --system "${{ matrix.system }}"
          nix flake show --system "${{ matrix.system }}"

      - name: Build ArtCraft packages
        run: |
          for package in photocraft vectorcraft filmcraft lightcraft effectcraft designcraft pdfcraft; do
            nix build --system "${{ matrix.system }}" ".#$package"
          done
