name: Update mlx hashes on Renovate PRs (Darwin)

on:
  # Updaters stay on pull_request_target: a push made with GITHUB_TOKEN cannot
  # start workflows, but a pull_request trigger would instead park a run in the
  # approval-required state, which never executes and keeps the PR pending.
  pull_request_target:
    branches: [master]
    paths:
      - "packages/mlx/default.nix"
      - "packages/mlx-lm/default.nix"
      - ".github/scripts/report-status.sh"
      - ".github/workflows/mlx-hash-update-darwin.yml"

concurrency:
  group: mlx-hash-update-darwin-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  update-mlx-hashes:
    # Only this package's Renovate branches. `update/` alone would also match
    # action-digest bumps, which touch every workflow file.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'update/mlx-') ||
       startsWith(github.head_ref, 'update/mlx-lm-'))
    runs-on: macos-26
    permissions:
      contents: write
      statuses: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@2cb76beab460be7e44442c7ebdcbc30b638416df # main

      - name: Setup Nix cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nixautopkgs
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # darwin-only: nothing here is consumed on the NixOS machines
          skipPush: true

      - name: Assert Renovate branch context
        run: |
          echo "head_ref=${GITHUB_HEAD_REF}"
          echo "head_repo=${{ github.event.pull_request.head.repo.full_name }}"
          echo "base_repo=${{ github.repository }}"
          [[ "${GITHUB_HEAD_REF}" == update/* ]]
          [[ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]

      - name: Detect package paths updated in PR
        id: detect-packages
        run: |
          git fetch origin "${{ github.base_ref }}:${{ github.base_ref }}"
          CHANGED_FILES="$(git diff --name-only "${{ github.base_ref }}...HEAD")"

          echo "Changed files:"
          printf '%s\n' "$CHANGED_FILES"

          run_mlx=false
          run_mlx_lm=false

          if printf '%s\n' "$CHANGED_FILES" | grep -qx "packages/mlx/default.nix"; then
            run_mlx=true
          fi

          if printf '%s\n' "$CHANGED_FILES" | grep -qx "packages/mlx-lm/default.nix"; then
            run_mlx_lm=true
          fi

          echo "run_mlx=$run_mlx" >> "$GITHUB_OUTPUT"
          echo "run_mlx_lm=$run_mlx_lm" >> "$GITHUB_OUTPUT"

      - name: Update mlx hashes
        if: steps.detect-packages.outputs.run_mlx == 'true'
        run: nix run nixpkgs#nix-update -- --flake --version=skip mlx

      - name: Update mlx-lm hashes
        if: steps.detect-packages.outputs.run_mlx_lm == 'true'
        run: nix run nixpkgs#nix-update -- --flake --version=skip mlx-lm

      - name: Build mlx package
        if: steps.detect-packages.outputs.run_mlx == 'true' || steps.detect-packages.outputs.run_mlx_lm == 'true'
        run: nix build .#mlx

      - name: Build mlx-lm package
        if: steps.detect-packages.outputs.run_mlx == 'true' || steps.detect-packages.outputs.run_mlx_lm == 'true'
        run: nix build .#mlx-lm

      - name: Commit and push changes
        run: |
          if [[ "${{ steps.detect-packages.outputs.run_mlx }}" != "true" && "${{ steps.detect-packages.outputs.run_mlx_lm }}" != "true" ]]; then
            echo "No updateable package paths changed in PR"
            exit 0
          fi

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No hash changes detected"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/mlx/default.nix packages/mlx-lm/default.nix
          git commit -m "chore: update mlx package hashes"
          git push

      - name: Report success on the pushed commit
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/report-status.sh success "hash-update/mlx" "built mlx and mlx-lm on aarch64-darwin"

      - name: Report failure on the evaluated commit
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/report-status.sh failure "hash-update/mlx" "hash refresh or build failed" || true
