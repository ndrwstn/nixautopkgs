name: Update ArtCraft hashes on Renovate PRs

on:
  # Updaters stay on pull_request_target: a push made with GITHUB_TOKEN cannot
  # start workflows, but a pull_request trigger would instead park a run in the
  # approval-required state, which never executes and keeps the PR pending.
  pull_request_target:
    branches: [master]
    paths:
      - "packages/artcraft/**"
      - ".github/artcraft-packages.txt"
      - ".github/scripts/report-status.sh"
      - ".github/workflows/artcraft-hash-update.yml"

concurrency:
  group: artcraft-hash-update-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  update-artcraft:
    # Only this family's Renovate branches. `update/` alone would also match
    # action-digest bumps, which touch every workflow file and would otherwise
    # run a full hash refresh here.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'update/artcraft-suite') ||
       startsWith(github.head_ref, 'update/storytold-'))
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      statuses: write
      actions: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@2cb76beab460be7e44442c7ebdcbc30b638416df # main

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@f69a2d3e148e90223fe63ab6e3f6331f2e7e33dc # main

      - name: Assert Renovate branch context
        run: |
          echo "head_ref=${GITHUB_HEAD_REF}"
          echo "head_repo=${{ github.event.pull_request.head.repo.full_name }}"
          echo "base_repo=${{ github.repository }}"
          [[ "${GITHUB_HEAD_REF}" == update/* ]]
          [[ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]

      - name: Update hashes and build every package
        run: |
          while read -r package; do
            [[ -n "$package" ]] || continue
            version="$(sed -n '/pname = "'"$package"'";/,/version = /s/.*version = "\([^"]*\)";.*/\1/p' packages/artcraft/default.nix)"
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/storytold/$package/v$version/Cargo.lock" \
              > "packages/artcraft/locks/$package.Cargo.lock"
            nix run nixpkgs#nix-update -- --flake --version=skip "$package"
            nix build ".#$package"
          done < .github/artcraft-packages.txt

          # nix-update rewrites the cargoLock attrset and drops
          # `inherit outputHashes;`, which is what supplies the git-dependency
          # hashes for craft-ui and craft-print. common.nix is shared by all 14
          # packages, so nothing here may rewrite it: only default.nix and
          # locks/ are ours to change.
          git checkout -- packages/artcraft/common.nix

      - name: Commit and push hash updates
        run: |
          if [[ -z "$(git status --porcelain -- packages/artcraft)" ]]; then
            echo "No hash changes detected"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/artcraft
          git commit -m "chore: update ArtCraft package hashes"
          git push

      - name: Dispatch ArtCraft checks for the updated branch
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run artcraft-checks.yml --ref "$GITHUB_HEAD_REF" || echo "check dispatch skipped"

      - name: Report success on the pushed commit
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/report-status.sh success "hash-update/artcraft" "built all ArtCraft packages on x86_64-linux"

      - name: Report failure on the evaluated commit
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/report-status.sh failure "hash-update/artcraft" "hash refresh or build failed" || true
