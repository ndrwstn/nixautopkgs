name: Update ArtCraft hashes on Renovate PRs

on:
  pull_request_target:
    branches: [master]
    paths:
      - "packages/artcraft/default.nix"
      - "packages/artcraft/locks/*.lock"
      - ".github/workflows/artcraft-hash-update.yml"

concurrency:
  group: artcraft-hash-update-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  update-artcraft:
    if: startsWith(github.head_ref, 'update/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # main

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@f69a2d3e148e90223fe63ab6e3f6331f2e7e33dc # main

      - name: Assert Renovate branch context
        run: |
          [[ "${GITHUB_HEAD_REF}" == update/* ]]
          [[ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]

      - name: Detect changed ArtCraft packages
        id: packages
        run: |
          git fetch origin "${{ github.base_ref }}:${{ github.base_ref }}"
          if git diff --name-only "${{ github.base_ref }}...HEAD" \
            | grep -q '^packages/artcraft/default\.nix$'; then
            printf '%s\n' photocraft vectorcraft filmcraft lightcraft effectcraft designcraft pdfcraft \
              deckcraft gridcraft cadcraft soundcraft wordcraft figcraft \
              > artcraft-packages.txt
          else
            : > artcraft-packages.txt
          fi

          if [[ ! -s artcraft-packages.txt ]]; then
            echo "No ArtCraft package changed"
            exit 0
          fi

          cat artcraft-packages.txt

      - name: Update hashes and build changed packages
        run: |
          while read -r package; do
            version="$(sed -n '/pname = "'"$package"'";/,/version = /s/.*version = "\([^"]*\)";.*/\1/p' packages/artcraft/default.nix)"
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/storytold/$package/v$version/Cargo.lock" \
              > "packages/artcraft/locks/$package.Cargo.lock"
            nix run nixpkgs#nix-update -- --flake --version=skip "$package"
            nix build ".#$package"
          done < artcraft-packages.txt

      - name: Commit and push hash updates
        run: |
          if [[ -z "$(git status --porcelain -- packages/artcraft)" ]]; then
            echo "No hash changes detected"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/artcraft
          git commit -m "chore: update ArtCraft package hashes"
          git push
